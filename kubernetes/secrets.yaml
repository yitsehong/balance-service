apiVersion: v1
kind: Secret
metadata:
  name: balance-service-secrets
  namespace: fasterdev-test
type: Opaque
stringData:
  application.yml: |-
    server:
      port: 8080
    
    # ===================================================================
    # = GRPC SERVER CONFIGURATION
    # ===================================================================
    grpc:
      server:
        port: 9091
        reflection-service-enabled: true
    
    spring:
      application:
        name: balance-service
      lifecycle:
        timeout-per-shutdown-phase: 30s
      threads:
        virtual:
          enabled: true
      datasource:
        # Replace with your MySQL connection details
        url: jdbc:mysql://rds.fasterdev.xrex.works:3306/exchange?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&autoReconnect=true&rewriteBatchedStatements=true&allowMultiQueries=true&useSSL=false
        username: exchange
        password: abcd1234
        driver-class-name: com.mysql.cj.jdbc.Driver
        type: com.zaxxer.hikari.HikariDataSource
        hikari:
          # --- Performance Tuning --- #
          pool-name: BalanceServiceHikariPool
          maximum-pool-size: 20 # Max number of connections
          minimum-idle: 5 # Min number of idle connections
          connection-timeout: 30000 # 30 seconds
          idle-timeout: 600000 # 10 minutes
          max-lifetime: 1800000 # 30 minutes
    
      # ===================================================================
      # = JPA/HIBERNATE CONFIGURATION
      # ===================================================================
      jpa:
        # We let JPA provide the connection pool, but we don't use its DDL features.
        hibernate:
          # 'validate': checks if the schema matches entities at startup (if any exist).
          # 'none': does nothing. User override to 'none'.
          ddl-auto: none
        # We don't need to show JPA-generated SQL because we write our own in JdbcTemplate.
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
            format_sql: true
            physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
            enable_lazy_load_no_trans: true
            jdbc:
              time_zone: UTC
              batch_size: 1000
            temp:
              use_jdbc_metadata_defaults: false
            order_updates: true
    
      # ===================================================================
      # = KAFKA CONFIGURATION
      # ===================================================================
      kafka:
        bootstrap-servers: 11.0.50.244:9092,11.0.4.8:9092,11.0.25.41:9092
        properties:
          security:
            protocol: SASL_PLAINTEXT
          sasl:
            mechanism: PLAIN
            jaas:
              config: org.apache.kafka.common.security.plain.PlainLoginModule required username="user1" password="abcd123456";
        consumer:
          auto-offset-reset: latest
    
    # ===================================================================
    # = CUSTOM APP CONFIGURATION
    # ===================================================================
    app:
      kafka:
        transfer-persistence-event:
          topic: t.balance-service.balance-transfer
          group: g.balance-service.balance-transfer
          max-poll-records: 1000
        trade-event:
          topic: t.balance-service.trade-event
          group: g.balance-service.trade-event
          max-poll-records: 1000
        cancel-order-event:
          topic: t.balance-service.cancel-order-event
          group: g.balance-service.cancel-order-event
          max-poll-records: 1000
    
    balance-service:
      fee-chainup-id: 1001
      mm-chainup-id: 63743
    
    snowflake:
      worker-id: 1
      datacenter-id: 1
    
    raft:
      id: "n1"
      group:
        id: "3f0d6d49-54a7-4161-9f8c-27a8563312c7"
      host: 127.0.0.1
      port: 8886
      # Force using Nio for gRPC to avoid Epoll dependency issues in native image on non-Linux
      grpc:
        server:
          port: 9090
          reflection-service-enabled: true
      batch-processor:
        thread-pool:
          core-size: 2
          max-size: 4
          queue-capacity: 10000
    
    management:
      endpoint:
        health:
          show-details: always
      endpoints:
        web:
          exposure:
            include: health, info, prometheus, threaddump
          base-path: /internal/actuator
      prometheus:
        metrics:
          export:
            enabled: true
      metrics:
        tags:
          application: balance-service
