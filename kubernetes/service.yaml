apiVersion: v1
kind: Service
metadata:
  name: balance-service-headless
  namespace: fasterdev-test
spec:
  clusterIP: None
  selector:
    app: balance-service
  ports:
  - name: raft
    port: 8886
    targetPort: 8886
  - name: grpc
    port: 9090
    targetPort: 9090
  - name: web
    port: 8080
    targetPort: 8080
