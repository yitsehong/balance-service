apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: balance-service
  name: balance-service
  namespace: fasterdev-test
spec:
  serviceName: "balance-service-headless"
  replicas: 3
  selector:
    matchLabels:
      app: balance-service
  template:
    metadata:
      labels:
        app: balance-service
    spec:
      nodeSelector:
        app: java
      containers:
      - name: balance-service
        image: 594719381662.dkr.ecr.ap-northeast-1.amazonaws.com/balance-service:graal-25
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        # Extract ordinal from hostname and prefix with 'n' for Raft ID
        args:
          - >-
            export RAFT_ID=n${HOSTNAME##*-};
            ./balance-service \
              -Dorg.apache.ratis.thirdparty.io.netty.transport.noNative=true \
              -Dorg.apache.ratis.thirdparty.io.netty.noPreferDirect=true \
              --spring.config.location=/opt/conf/application.yml
        env:
          - name: RAFT_GROUP_PEERS
            # Define the full group using the headless service DNS
            value: "n0=balance-service-0.balance-service-headless:8886,n1=balance-service-1.balance-service-headless:8886,n2=balance-service-2.balance-service-headless:8886"
        ports:
        - containerPort: 8080
          name: web
          protocol: TCP
        - containerPort: 8886
          name: raft
          protocol: TCP
        - containerPort: 9090
          name: grpc
          protocol: TCP
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          httpGet:
            path: /common/health
            port: 8080
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /common/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /common/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /opt/conf/application.yml
          name: config
          readOnly: true
          subPath: application.yml
      volumes:
      - secret:
          secretName: balance-service-secrets
        name: config
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: java-test
