syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.xrex.grpc";
option java_outer_classname = "TransferProto";

package balanceservice;

// The transfer service definition.
service TransferService {
  // Creates a new transfer
  rpc Transfer (TransferListRequest) returns (TransferResponse) {}
}

// The request message containing the list of transfer details.
message TransferListRequest {
  repeated TransferRequest requests = 1;
}

// The request message containing the transfer details.
message TransferRequest {
  int32 from_uid = 1;
  int32 from_type = 2;
  string from_sub_type = 3;
  int32 to_uid = 4;
  int32 to_type = 5;
  string to_sub_type = 6;
  string amount = 7;
  string scene = 8;
  string meta = 9;
  string refType = 10;
  int64 refId = 11;
  int32 opUid = 12;
  string opIp = 13;
}

// The response message containing the transaction ID.
message TransferResponse {
  bool success = 1;
  repeated string event_key = 2;
  string message = 3;
}
